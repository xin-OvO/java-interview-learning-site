<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Java 后端互动知识手册 · 离线预览</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7fa;color:#172a39}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}
button{font-family:inherit;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}button:focus-visible{outline:3px solid #05a58d;outline-offset:3px}
.site-head{position:sticky;top:0;z-index:10;background:#102d3b;color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 3px 10px #0b243015}
.site-head strong{font-size:16px}.site-head small{color:#a0e1d3;font-size:11px}
.layout{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:calc(100vh - 56px)}
.sidebar{background:white;border-right:1px solid #dae5ea;padding:24px 13px;position:sticky;top:55px;height:calc(100vh - 55px);overflow-y:auto}
.sidebar-header{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#718895;padding:0 10px 12px}
.sidebar-group{margin-bottom:16px}.sidebar-group strong{display:block;font-size:11px;color:#67808c;padding:7px 10px}
.sidebar-group button{display:block;border:0;text-align:left;background:transparent;width:100%;font-size:12px;line-height:1.5;padding:10px 12px;color:#486173;border-radius:8px}
.sidebar-group button.active{background:#e0f5ee;color:#066e5c;font-weight:700}
.main{width:100%;max-width:1100px;margin:0 auto;padding:25px 34px;min-width:0}
.status-note{border:1px solid #b6dfd2;background:#edf9f4;border-radius:12px;padding:15px 17px;font-size:13px;color:#236b59;line-height:1.75}
.page-control{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0}
.page-control span{color:#67808c;font-size:12px}.page-control select{border:1px solid #d2e0e5;border-radius:9px;background:white;padding:10px;max-width:75%;font-family:inherit;color:#163849;font-size:13px}
.chapter{display:none}.chapter.active{display:block}.chapter-kicker{font-size:12px;color:#09866e;font-weight:800;margin-bottom:8px}
.chapter h1{font-size:27px;line-height:1.35;margin-top:5px;margin-bottom:20px;letter-spacing:-.02em}
.chapter h2{font-size:21px;line-height:1.5;margin-top:34px;margin-bottom:16px;border-bottom:1px solid #dce8ea;padding-bottom:9px}
.chapter h3{font-size:16px;line-height:1.5;margin-top:22px}
.chapter p,.chapter li{font-size:14px;line-height:1.85}.chapter ul,.chapter ol{padding-left:23px}.chapter blockquote{border-left:4px solid #0d9c83;background:#eaf7f1;padding:3px 16px;margin-left:0}
.chapter pre{padding:17px 20px;background:#182c39;color:#f0f8f9;border-radius:12px;overflow:auto;font-size:12px;line-height:1.65}.chapter code{font-family:ui-monospace,Menlo,Consolas,monospace}.chapter :not(pre)>code{background:#e9f1f3;color:#0a7060;border-radius:5px;padding:2px 4px;font-size:.9em}
.chapter table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:13px;line-height:1.65}.chapter th,.chapter td{border:1px solid #d6e4e8;padding:9px 11px;text-align:left;min-width:115px}.chapter th{background:#e7f0f2}.chapter a{color:#078670}.chapter .lead{font-size:16px;color:#42616f;line-height:1.9}
.admon{padding:15px 20px;margin:19px 0;border-radius:12px;border:1px solid #b9dccf;background:#eaf7ef}.admon-info{background:#ecf6fc;border-color:#c6dfee}.admon-warning{background:#fff6e8;border-color:#f2d39f}.admon p:last-child{margin-bottom:0}.legacy-note{font-size:13px;color:#567786;margin-bottom:13px}.legacy-frame{border:1px solid #d3e1e3;border-radius:10px;height:980px;width:100%;background:white}
.generic-widget{border:1px solid #ccdedf;background:#f8fbfa;border-radius:15px;padding:18px;margin:21px 0}.widget-head{display:flex;justify-content:space-between;gap:10px}.widget-head strong{font-size:16px}.widget-head small{font-size:12px;color:#688592;white-space:nowrap}
.widget-sub{font-size:12px;color:#68818c;margin:7px 0 12px}.widget-modes{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.widget-btn{border:1px solid #c8dadd;background:white;color:#244e5e;padding:9px 11px;border-radius:9px;font-size:12px}.widget-btn.active,.widget-btn.primary{background:#098875;border-color:#098875;color:white}
.widget-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;animation:pop .18s ease}.widget-card{background:#fff;border:1px solid #d1e0e1;min-width:0;min-height:125px;padding:12px;border-radius:11px;display:flex;flex-direction:column;gap:7px;overflow-wrap:anywhere}
.widget-card.focus{border-color:#0c947d;box-shadow:inset 0 0 0 1px #0c947d}.widget-card small{color:#66808b;font-size:11px}.widget-card strong{color:#078870;font-size:22px;line-height:1.3;word-break:break-word}.widget-card span{font-size:12px;color:#526b76;line-height:1.5}
.timeline{display:flex;gap:4px;margin:13px 0}.timeline i{flex:1;height:5px;background:#dae5e6;border-radius:4px}.timeline i.done{background:#0a8e7a}
.widget-explain{background:#fff;padding:15px;border:1px solid #deeaeb;border-radius:10px;min-height:120px}.widget-explain strong{font-size:14px}.widget-explain p{font-size:13px;line-height:1.85;margin:7px 0}.widget-explain pre{padding:9px 12px;margin:8px 0 0;font-size:11px}
.widget-controls{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 0}.widget-controls>div{display:flex;gap:7px}.widget-foot{font-size:11px!important;color:#6a828b;margin:8px 0 0!important;line-height:1.7!important}
.quiz-choices{display:grid;gap:8px}.quiz-choices button{text-align:left;border:1px solid #d3e3e3;background:white;border-radius:9px;padding:11px 13px;font-size:13px;color:#304c5b}
.quiz-choices button.chosen{border-color:#0a9881;background:#eef9f4}.quiz-choices button.correct{border-left:4px solid #0a9881}
.quiz-reply{background:white;border:1px solid #cde5de;border-radius:10px;padding:13px;margin:12px 0 0}.quiz-reply p{font-size:13px;margin:7px 0}.quiz-reply button{margin-top:7px}
#not-ready-msg{display:none;background:#fff5e8;border:1px solid #efd5af;padding:12px;border-radius:10px;font-size:13px;margin:14px 0}.site-footer{color:#758b94;font-size:11px;margin:26px 0 10px}
@keyframes pop{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:950px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;flex-wrap:wrap;gap:12px;padding:9px 15px;max-height:220px}.sidebar-header{width:100%;padding:0}.sidebar-group{margin:0}.sidebar-group button{padding:6px 9px}.main{padding:17px}}
@media(max-width:600px){.site-head{padding:12px 16px}.site-head strong{font-size:13px}.site-head small{display:none}.chapter h1{font-size:23px}.widget-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.widget-card{padding:9px}.widget-card strong{font-size:18px}.generic-widget{padding:12px}.widget-controls{flex-wrap:wrap}.chapter pre{padding:10px}}
@media(prefers-reduced-motion:reduce){.widget-cards{animation:none}}
</style></head><body>
<header class="site-head"><strong>☕ Java 后端 · 互动知识手册</strong><small>Markdown + Vue · 同一本书 · 本地预览</small></header>
<div class="layout"><aside class="sidebar"><div class="sidebar-header">全书 @@READY@@ / @@TOTAL@@ 可阅读</div>@@NAV@@</aside><main class="main">
<div class="status-note">这是从完整项目<strong>现有 Markdown 章节与动画 JSON</strong> 自动生成的免安装预览。不会单独维护另一份教材；正式站仍由 VitePress 渲染。每章的动画和自测可直接点击体验。</div>
<div class="page-control"><span>选择章节</span><select id="chapter-select" aria-label="选择章节"></select></div>
<div id="not-ready-msg">这一章仍在计划中，离线预览暂未收录。请从导航里选择已完成的章节。</div>
@@SECTIONS@@
<footer class="site-footer">课程唯一来源：<code>docs/</code>；预览构建脚本：<code>scripts/create-offline-preview.py</code></footer>
</main></div>
<script type="application/json" id="dataset-labs">@@LABS@@</script>
<script type="application/json" id="dataset-quizzes">@@QUIZZES@@</script>
<script type="application/json" id="dataset-initial">@@INITIAL@@</script>
<script>
(() => {
'use strict';
const labs = JSON.parse(document.getElementById('dataset-labs').textContent);
const quizzes = JSON.parse(document.getElementById('dataset-quizzes').textContent);
const initial = JSON.parse(document.getElementById('dataset-initial').textContent);
const pages = [...document.querySelectorAll('section.chapter')];
const selector = document.getElementById('chapter-select');
const escape = x => String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
pages.forEach(p => {const option=document.createElement('option');option.value=p.id;option.textContent=p.dataset.title;selector.appendChild(option)});
function openPage(id, updateHash=true){
  const valid=pages.some(p=>p.id===id);
  if(!valid){document.getElementById('not-ready-msg').style.display='block';return;}
  document.getElementById('not-ready-msg').style.display='none';
  pages.forEach(p=>p.classList.toggle('active',p.id===id));
  document.querySelectorAll('[data-open]').forEach(b=>b.classList.toggle('active',b.dataset.open===id));
  selector.value=id;
  if(updateHash) history.replaceState(null,'','#'+id);
  window.scrollTo(0,0);
}
document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openPage(el.dataset.open)));
selector.addEventListener('change',()=>openPage(selector.value));
window.addEventListener('hashchange',()=>openPage(decodeURIComponent(location.hash.slice(1)),false));
openPage(decodeURIComponent(location.hash.slice(1))||initial,false);

function controls(index,total,onReset,onBack,onNext){return `<div class="widget-controls"><button class="widget-btn" data-control="reset" ${index===0?'disabled':''}>↺ 重置</button><div><button class="widget-btn" data-control="back" ${index===0?'disabled':''}>← 上一步</button><button class="widget-btn primary" data-control="next">${index===total-1?'重新演示 ↺':'下一步 →'}</button></div></div>`}
function bindControls(root,ops){for(const [key,fn] of Object.entries(ops)){const btn=root.querySelector(`[data-control="${key}"]`);if(btn)btn.addEventListener('click',fn)}}
function labGeneric(root,data){let mode=data.modes[0].id,index=0;
 function render(){const items=data.scenarios[mode],f=items[index],m=data.modes.find(x=>x.id===mode);
 const choices=data.modes.map(x=>`<button type="button" class="widget-btn ${x.id===mode?'active':''}" data-mode="${escape(x.id)}" aria-pressed="${x.id===mode}">${escape(x.name)}</button>`).join('');
 const cards=f.cards.map((x,i)=>`<div class="widget-card ${f.focus===i?'focus':''}"><small>${escape(x.label)}</small><strong>${escape(x.value)}</strong><span>${escape(x.detail)}</span></div>`).join('');
 root.innerHTML=`<div class="generic-widget"><div class="widget-head"><strong>${escape(data.title)}</strong><small>第 ${index+1} / ${items.length} 步</small></div><p class="widget-sub">${escape(data.intro)}</p><div class="widget-modes">${choices}</div><p class="widget-sub">${escape(m.subtitle)}</p><div class="widget-cards">${cards}</div><div class="timeline">${items.map((_,i)=>`<i class="${i<=index?'done':''}"></i>`).join('')}</div><div class="widget-explain" aria-live="polite"><strong>${escape(f.headline)}</strong><p>${escape(f.note)}</p>${f.code?`<pre><code>${escape(f.code)}</code></pre>`:''}</div>${controls(index,items.length)}<p class="widget-foot">${escape(data.footnote)}</p></div>`;
 root.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;index=0;render()}));
 bindControls(root,{reset:()=>{index=0;render()},back:()=>{index=Math.max(0,index-1);render()},next:()=>{index=(index+1)%items.length;render()}});
 }
 render();}
function labCounter(root,data){let mode='volatile',index=0;
 function render(){const items=data.scenarios[mode],f=items[index],m=data.modes.find(x=>x.id===mode);
 const cards=[{label:'线程 A',value:f.a,detail:f.aState},{label:'共享 count',value:f.value,detail:f.lock||'count'},{label:'线程 B',value:f.b,detail:f.bState}];
 root.innerHTML=`<div class="generic-widget"><div class="widget-head"><strong>双线程加一实验室</strong><small>第 ${index+1} / ${items.length} 步</small></div><div class="widget-modes">${data.modes.map(x=>`<button class="widget-btn ${x.id===mode?'active':''}" data-mode="${x.id}">${escape(x.name)}</button>`).join('')}</div><p class="widget-sub">${escape(m.subtitle)}</p><div class="widget-cards">${cards.map((c,i)=>`<div class="widget-card ${i===(f.actor==='A'?0:f.actor==='B'?2:1)?'focus':''}"><small>${c.label}</small><strong>${escape(c.value)}</strong><span>${escape(c.detail)}</span></div>`).join('')}</div><div class="timeline">${items.map((_,i)=>`<i class="${i<=index?'done':''}"></i>`).join('')}</div><div class="widget-explain"><strong>${escape(f.action)}</strong><p>${escape(f.note)}</p></div>${controls(index,items.length)}<p class="widget-foot">这是教学交错的示意，不代表真实 CPU 或 JDK 底层指令执行过程。</p></div>`;
 root.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;index=0;render()}));
 bindControls(root,{reset:()=>{index=0;render()},back:()=>{index=Math.max(0,index-1);render()},next:()=>{index=(index+1)%items.length;render()}})
 }
 render();}
function quizGeneric(root,questions){let index=0,selected=-1;
 function render(){const q=questions[index];root.innerHTML=`<div class="generic-widget"><div class="widget-head"><strong>即时理解测试</strong><small>第 ${index+1} / ${questions.length} 题</small></div><p><strong>${escape(q.question)}</strong></p><div class="quiz-choices">${q.choices.map((s,i)=>`<button data-answer="${i}" class="${selected===i?'chosen':''} ${selected>=0&&q.correct===i?'correct':''}" aria-pressed="${selected===i}">${'ABCD'[i]}. ${escape(s)}</button>`).join('')}</div>${selected>=0?`<div class="quiz-reply" aria-live="polite"><strong>${selected===q.correct?'✓ 正确':'正确答案：'+'ABCD'[q.correct]}</strong><p>${escape(q.explanation)}</p><button class="widget-btn primary" data-next>${index===questions.length-1?'再测一轮 ↺':'下一题 →'}</button></div>`:''}</div>`;
 root.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.answer);render()}));
 const btn=root.querySelector('[data-next]');if(btn)btn.addEventListener('click',()=>{selected=-1;index=(index+1)%questions.length;render()})
 }
 render();}
document.querySelectorAll('[data-lab]').forEach(root=>labGeneric(root,labs[root.dataset.lab]));
document.querySelectorAll('.old-counter-lab').forEach(root=>labCounter(root,labs['legacy-counter']));
document.querySelectorAll('[data-quiz]').forEach(root=>quizGeneric(root,quizzes[root.dataset.quiz]));
})();
</script></body></html>
